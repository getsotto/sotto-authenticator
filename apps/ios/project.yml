name: AuthenticatorSpike
options:
  bundleIdPrefix: dev.getsotto.authenticator
  deploymentTarget:
    iOS: "17.0"
schemes:
  AuthenticatorSpike:
    build:
      targets:
        AuthenticatorSpike: all
        AuthenticatorSpikeTests: [test]
    test:
      targets:
        - AuthenticatorSpikeTests
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  AuthenticatorSpike:
    type: application
    platform: iOS
    sources:
      - path: Authenticator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.getsotto.authenticator.spike
        PRODUCT_NAME: SottoAuthenticatorSpike
        INFOPLIST_KEY_CFBundleDisplayName: Sotto Authenticator Spike
        INFOPLIST_KEY_NSFaceIDUsageDescription: Authenticate to use disposable synthetic signing and vault-key experiments.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Authenticator/Generated"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Authenticator/Generated/authenticator_bridgeFFI.modulemap"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Authenticator/Generated"
        OTHER_LDFLAGS: "$(inherited) -lc++"
    dependencies:
      - framework: ../../build/ios/AuthenticatorCore.xcframework
        embed: false
  AuthenticatorSpikeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: AuthenticatorSpike
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.getsotto.authenticator.spike.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SottoAuthenticatorSpike.app/SottoAuthenticatorSpike"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/Authenticator/Generated"
        OTHER_SWIFT_FLAGS: "$(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/Authenticator/Generated/authenticator_bridgeFFI.modulemap"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Authenticator/Generated"
