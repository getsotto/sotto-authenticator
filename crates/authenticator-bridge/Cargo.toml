[package]
name = "authenticator-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "authenticator_bridge"
crate-type = ["cdylib", "staticlib"]

[dependencies]
aes-gcm = "0.10"
data-encoding = "2.9"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
uniffi = "0.32.2"
zeroize = "1"

[dev-dependencies]
bip39 = { version = "3.0.0", default-features = false, features = ["zeroize"] }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
tempfile = "3"
zeroize = { version = "1", features = ["serde"] }
